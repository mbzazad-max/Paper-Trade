name: Build and deploy Paper-Trade
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this run (Market-Data, the Refresh button or an owner action fills this in)'
        required: false
        default: 'manual'
      payload:
        description: 'Owner Close all / Book % action as JSON (blank = just rebuild)'
        required: false
        default: ''
      force:
        description: 'Rebuild even if no new candles arrived (the Data check page sends this)'
        type: boolean
        default: false
  schedule:
    - cron: '15 1 * * *'   # daily safety net after the 11:30 and 11:40 Sydney loads (12:15 Sydney summer time); data commits trigger it too
  push:
    branches: [main]
    paths: ['public/*.js', 'public/index.html', 'worker/**', 'build/**', 'config/**', 'cycle/**', 'metal/**', 'reference/**', 'tests/**', 'wrangler.jsonc', '.github/workflows/build.yml']
permissions:
  contents: write
  issues: write
concurrency:
  group: paper-trade
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Coin Zones, Signal Desk and cycle engine files must be byte-identical to the originals
        run: sha256sum -c --quiet reference/SOURCE_SHA256SUMS
      - name: Check secrets
        env:
          MD: ${{ secrets.MARKET_DATA_TOKEN }}
        run: '[ -n "$MD" ] || { echo "::error::Secret MARKET_DATA_TOKEN is not set, so the shared data cannot be read. Nothing changed."; exit 1; }'
      - uses: actions/checkout@v4
        with:
          repository: mbzazad-max/market-data
          token: ${{ secrets.MARKET_DATA_TOKEN }}
          path: md
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fresh start (fixes the start at the next 4H boundary on the first run; opens the test once it is reached)
        run: node build/setup.js --resolve
      - name: Board advice from closed candles (unchanged Coin Zones build.js; records advice only after the start)
        run: node build/build.js md ${{ inputs.force && '--force' || '' }}
      - name: 4H structure shift and the MSS orders (unchanged Coin Zones structure.js)
        run: node build/structure.js md --from "$(date -u -d '3 days ago' +%F)" > /dev/null
      - name: Owner action (Close all / Book %), checked against the last closed 4H candle
        if: ${{ github.event.inputs.payload != '' }}
        env:
          PAPER_ACTION: ${{ github.event.inputs.payload }}
        run: node build/apply-action.js md
      - name: The three tabs (each coin without a manual action must equal Coin Zones' own pnl.js, or nothing is written)
        run: node build/paper.js md
      - name: MSS-RVOL separate five-coin paper ledger (Market-Data read-only)
        id: mssrvol
        # A failure here (e.g. a missing 1H candle) must not stop the other tabs from saving.
        # mss-rvol.js writes nothing on failure, so its last good state and page stay as they were.
        continue-on-error: true
        run: node build/mss-rvol.js md
      - name: MSS-RVOL warning
        if: ${{ steps.mssrvol.outcome == 'failure' }}
        run: echo "::warning::MSS-RVOL did not update this run; other tabs saved. Its page keeps the last good build until the next successful run."
      - name: RSI Signal Desk candles (BTC, plus ETH for its link section; 4H and 1D; the original engine runs in the page)
        id: signaldesk
        # Like MSS-RVOL: a failure here must not stop the other tabs from saving; signal-desk.js writes nothing on failure.
        continue-on-error: true
        run: node build/signal-desk.js md
      - name: RSI Signal Desk warning
        if: ${{ steps.signaldesk.outcome == 'failure' }}
        run: echo "::warning::RSI Signal Desk did not update this run; other tabs saved. It keeps the last good candles until the next successful run."
      - name: Cycle DCA (05), buys from the cycle-tab early bottom signs (byte-identical BTC & ETH dashboard engine), owner sells
        id: cycledca
        # Like MSS-RVOL: a failure here must not stop the other tabs from saving; cycle-dca.js writes nothing on failure.
        continue-on-error: true
        run: node build/cycle-dca.js md
      - name: Cycle DCA warning
        if: ${{ steps.cycledca.outcome == 'failure' }}
        run: echo "::warning::Cycle DCA did not update this run; other tabs saved. It keeps its last good files until the next successful run."
      - name: Tests
        run: |
          node tests/cycle-dca.js
          node tests/mss-rvol.js
          node tests/manual.js
          node tests/parity-ledgers.js md
          npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26 > /dev/null
          node tests/render.js jsdom
          node tests/signal-desk.js md jsdom
          node tests/parity.js md jsdom > parity.json || { cat parity.json; exit 1; }
          node tests/fresh-start.js md
      - name: Cycle DCA buy emails (GitHub issue mentioning the owner, one per new buy; never twice)
        if: ${{ steps.cycledca.outcome == 'success' }}
        # A failed send must not stop the build from saving; an unsent buy is tried again next build.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node build/cycle-dca-alerts.js prepare "$RUNNER_TEMP/cdm"
          for f in "$RUNNER_TEMP"/cdm/*.id; do
            [ -e "$f" ] || continue
            k="${f%.id}"
            url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$(cat "$k.title")" --body-file "$k.md")" || { echo "::warning::Cycle DCA email not sent for $(cat "$f"); will retry next build."; continue; }
            node build/cycle-dca-alerts.js mark "$(cat "$f")" "$url"
          done
      - name: Save (one commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/start.json public/data.json public/freshness.json public/paper.json public/s083-paper.json state
          git add public/mss-rvol.json
          [ -f public/signal-desk.json ] && git add public/signal-desk.json
          [ -f public/cycle-dca.json ] && git add public/cycle-dca.json
          [ -f public/pnl.json ] && git add public/pnl.json
          [ -f public/structure.json ] && git add public/structure.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Paper-Trade build $(date -u '+%Y-%m-%d %H:%M') UTC (${{ github.event.inputs.reason || github.event_name }})"
          for i in 1 2 3 4 5; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; sleep $((i*2)); done
          echo "::error::Could not save the build."; exit 1
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REFRESH_TOKEN: ${{ secrets.MARKET_DATA_TOKEN }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          REFRESH_TOKEN="$(printf %s "$REFRESH_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          echo "Cloudflare token length: ${#CLOUDFLARE_API_TOKEN}"
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          echo "Control token length: ${#REFRESH_TOKEN}"
          [ "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32 ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not 32 characters (is the token in that box?). Built, not deployed."; exit 1; }
          [ "${#CLOUDFLARE_API_TOKEN}" -ge 40 ] || { echo "::error::CLOUDFLARE_API_TOKEN is too short. Built, not deployed."; exit 1; }
          npx -y wrangler@4 deploy   # workers_dev is off: only the home site (dashboards) can reach this Worker
          printf '%s' "$REFRESH_TOKEN" | npx -y wrangler@4 secret put GITHUB_TOKEN
